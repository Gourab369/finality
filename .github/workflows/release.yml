name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TARGET: x86_64-pc-windows-msvc
      ARCHIVE: finality-${{ github.ref_name }}-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p finality --target $env:TARGET
      - name: Package
        run: Compress-Archive -Path "target/$env:TARGET/release/finality.exe", LICENSE, README.md -DestinationPath $env:ARCHIVE
      # Same format as `sha256sum`, so `sha256sum -c` also accepts it.
      - name: Checksums
        run: |
          $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARCHIVE" | Out-File -Encoding utf8NoBOM SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            SHA256SUMS.txt
          generate_release_notes: true
